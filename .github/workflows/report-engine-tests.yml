name: Report Engine Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "samples/records-to-reports/**"
      - "requirements.txt"
      - ".github/workflows/report-engine-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "samples/records-to-reports/**"
      - "requirements.txt"
      - ".github/workflows/report-engine-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
